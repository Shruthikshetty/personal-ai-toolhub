[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolhub"
version = "0.1.0"
description = "Personal AI Toolkit — Unified REST API, CLI, and MCP interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Personal AI Toolkit" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "fastmcp>=4.1.0",
    "typer>=0.12.0",
    "kokoro[all]",
    "soundfile",
    "numpy",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

# Registers the `toolhub` command-line utility
[project.scripts]
toolhub = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]

# Ruff linter & formatter configuration
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904"]
